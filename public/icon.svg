<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="128" y1="82" x2="384" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="128" y1="82" x2="384" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="irisGrad" x1="220" y1="216" x2="292" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>

  <!-- Full-bleed dark backdrop for iOS & Android -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <rect width="512" height="512" fill="url(#glowGrad)" />

  <!-- Protective Shield -->
  <path
    d="M256 76 L396 126 C401 128 404 133 404 138 V246 C404 334 340 404 256 436 C172 404 108 334 108 246 V138 C108 133 111 128 116 126 L256 76 Z"
    fill="url(#shieldGrad)"
    stroke="url(#shieldBorder)"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- Inner Subtle Shield Highlight -->
  <path
    d="M256 98 L382 143 V245 C382 321 327 382 256 412 C185 382 130 321 130 245 V143 L256 98 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.16"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Eye Sclera -->
  <path
    d="M158 256 C182 210 218 190 256 190 C294 190 330 210 354 256 C330 302 294 322 256 322 C218 322 182 302 158 256 Z"
    fill="#FFFFFF"
  />

  <!-- Iris -->
  <circle cx="256" cy="256" r="44" fill="url(#irisGrad)" />

  <!-- Pupil -->
  <circle cx="256" cy="256" r="21" fill="#090D16" />

  <!-- Catchlight -->
  <circle cx="272" cy="240" r="9" fill="#FFFFFF" />
  <circle cx="242" cy="268" r="4" fill="#FFFFFF" fill-opacity="0.8" />

  <!-- Protective Emerald Check Accent Badge on Shield Top-Right -->
  <circle cx="348" cy="154" r="24" fill="#10B981" stroke="#0B1220" stroke-width="6" />
  <path
    d="M337 154 L345 162 L360 146"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
